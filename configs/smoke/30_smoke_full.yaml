# 8-bit AdamW only so the 0.5B full fine tune fits the 8 GB laptop for this smoke test
inherit: ../train.yaml
name: smoke_full
model: Qwen/Qwen2.5-Coder-0.5B-Instruct
train:
  method: full
  lr: 1.0e-5
  optim: adamw_bnb_8bit
  n_train: 20
  max_steps: 4
  save_steps: 2
  select_steps: [2, 4]
  per_device_batch: 2
  grad_accum: 2
eval:
  limit: 20
  gpu_memory_utilization: 0.6
  max_model_len: 3072
  enforce_eager: true
