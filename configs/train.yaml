# Shared SFT recipe. Matched across every trained run: data order (seed), steps, effective batch 16.
inherit: base.yaml
train:
  method: qlora
  rank: 16
  dropout: 0.05
  lr: 2.0e-4
  max_steps: 560        # ~1 epoch of the ~8.9k train pairs at effective batch 16
  save_steps: 70
  select_steps: [280, 420, 560]   # candidates scored on val; best one goes to dev
  per_device_batch: 1
  grad_accum: 16
  max_len: 2048
  warmup_ratio: 0.03
  optim: adamw_torch
eval:
  splits: [dev, heldback]
